name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Dependance
      run: rustup target add wasm32-wasip1
    - name: Build
      run: cargo build --target wasm32-wasip1 --release
    - name: Publish built wasm plugin to releases
      run: |
        VERSION="v$(grep '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
        gh release create "$VERSION" --generate-notes target/wasm32-wasip1/release/pleiad_cdpr.wasm
      env:
        GH_TOKEN: ${{ github.token }}
