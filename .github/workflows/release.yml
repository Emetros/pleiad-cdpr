name: Build release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Dependance
      run: rustup target add wasm32-wasip1
    - name: Build
      run: cargo build --target wasm32-wasip1 --release
    - name: Publish wasm build to Github Release
      run: |
        gh release create --generate-notes ./target/wasm32-wasip1/release/pleiad_cdpr.wasm
      env:
        GH_TOKEN: ${{ github.token }}
